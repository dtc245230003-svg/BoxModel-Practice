<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Box Model 2 - Box Shadow & Border Radius</title>
    <style>
        /* Khối div bên ngoài: Hình tròn với bóng đổ nội tuyến màu đỏ (indianred) */
        div {
            margin: auto;
            padding: 35px;
            width: 80px;
            box-shadow: inset 0 0 22px indianred;
            border-radius: 50%;
        }

        /* Khối div lồng bên trong: Góc bo nhẹ với bóng đổ nội tuyến màu xanh (seagreen) */
        div > div {
            padding: 0 0px 100px 0px;
            border-radius: 3%;
            box-shadow: inset 0 0 22px seagreen;
        }
    </style>
</head>
<body>

    <div>
        <div></div>
    </div>

</body>
</html>
